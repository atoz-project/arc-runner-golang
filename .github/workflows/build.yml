name: build

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/atoz-project/arc-runner-golang

jobs:
  build-and-push:
    # Public repo: GitHub-hosted runners are free here regardless of org billing.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tag
        id: tags
        run: |
          # One immutable date tag per build (e.g. 20260910.42). No floating
          # tags by design: the scale set pins a date tag and bumps
          # deliberately; ECI ImageCache also requires immutable tags.
          echo "tags=${{ env.IMAGE }}:$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
