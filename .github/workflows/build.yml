name: build

on:
  push:
    branches: [main]
    # Only image-affecting changes build. Docs/workflow-only commits would
    # fail the tag-overwrite guard (VERSION unchanged) for no benefit.
    paths: ["Dockerfile", "VERSION", ".github/workflows/build.yml"]
  workflow_dispatch:

# contents: write — the workflow pushes a git tag matching the image version.
permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/atoz-project/arc-runner-golang

jobs:
  build-and-push:
    # Public repo: GitHub-hosted runners are free here regardless of org billing.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tag
        id: tags
        run: |
          # Image SemVer from the VERSION file: one immutable :vX.Y.Z tag per
          # release. No floating tags by design; the scale set pins a version
          # and bumps deliberately; ECI ImageCache also requires immutable tags.
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.IMAGE }}:v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Guard against tag overwrite
        run: |
          # An existing :vX.Y.Z means VERSION was not bumped in this change —
          # fail loudly instead of moving an immutable tag. Deliberate rebuilds
          # of the same version are not a thing: bump VERSION (patch).
          if docker buildx imagetools inspect "${{ env.IMAGE }}:v${{ steps.tags.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::image tag v${{ steps.tags.outputs.version }} already exists — bump VERSION" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the commit
        run: |
          # Source ↔ image mapping: git tag matches the image tag.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.tags.outputs.version }}"
          git push origin "v${{ steps.tags.outputs.version }}"
